# 自用版发布流程：推送 v*.*.* Tag 后，构建未签名的 Windows x64 安装包与便携版，
# 并发布到本仓库的 GitHub Release，供应用内更新检查使用。
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在 Tag（例如 v1.2.1）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: "1.96.1"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag 必须是 vMAJOR.MINOR.PATCH 格式，实际为：$($env:RELEASE_TAG)"
          }
          $version = $Matches[1]
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "package.json 版本 $packageVersion 与 Tag $($env:RELEASE_TAG) 不一致，请先运行 npm run version:sync -- $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          & 'scripts/build-windows-local.ps1' -SkipNpmInstall -Clean

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "release/floral-notepaper_${VERSION}_x64-setup.exe"
            "release/floral-notepaper_${VERSION}_x64-portable.exe"
          )
          # 有对应版本的发布说明就使用，否则让 GitHub 自动生成
          notes_file="Docs/release-note/${VERSION}.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TAG" \
              --verify-tag \
              "${notes_args[@]}"
          fi
